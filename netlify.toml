[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
  # Always build. When Netlify's base-directory change detection skips a build,
  # it leaves its "Header rules" / "Redirect rules" GitHub checks stuck in
  # progress, and on cache eviction it falsely cancels real deploys.
  # Non-zero exit → never ignore → always build (same as playola's client).
  ignore = "/bin/false"

[build.environment]
  NODE_VERSION = "22.15.0"
  VITE_SERVER_BASE_URL = "https://api.marge.playola.fm"
  VITE_GOOGLE_CLIENT_ID = "360017545997-fi7r67lac1bvanjukfd77lrb27q18tet.apps.googleusercontent.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
